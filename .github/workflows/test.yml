name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3', '3.11', '3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Unit tests
        run: ./tests/run_unit_tests.sh
      - name: Integration tests
        run: ./tests/run_integration_tests.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"
          cache: 'pip'
      - name: Lint
        run: ./tests/run_linters.sh

  complete:
    if: ${{ always() }}
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check required job results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS_RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::All required jobs must succeed. A job failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "All required jobs passed!"
