name: Site

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gh-pages-site-pr-{0}', github.event.pull_request.number) || 'gh-pages-site' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-site:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.pages.outputs.host }}
      base-path: ${{ steps.pages.outputs.base_path }}
      artifact-name: github-pages
      version: ${{ github.event.release.tag_name || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        id: build-site
        uses: ./
        with:
          push: false
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: ./site

  test-site:
    needs: build-site
    permissions:
      contents: read
    uses: athackst/ci/.github/workflows/htmlproofer_site.yml@main
    with:
      host: ${{ needs.build-site.outputs.host }}
      base-path: ${{ needs.build-site.outputs.base-path }}
      artifact-name: ${{ needs.build-site.outputs.artifact-name }}

  deploy-site:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published') }}
    needs: build-site
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: athackst/ci/.github/workflows/deploy_site.yml@main
    with:
      type: branch
      version: ${{ needs.build-site.outputs.version }}
    secrets: inherit
